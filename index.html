<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>MissVill OS</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f7f4f2;
        color: #2f2927;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .profile-image {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 12px;
        display: none;
      }

      .title {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .status {
        margin-top: 16px;
        padding: 16px;
        border-radius: 14px;
        background: #f1eeec;
        word-break: break-word;
      }

      .error {
        background: #ffe8e8;
        color: #a02323;
      }

      .success {
        background: #eaf8ee;
        color: #176b35;
      }

      .action-button,
      .secondary-button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 16px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
      }

      .action-button {
        background: #2f2927;
        color: white;
      }

      .secondary-button {
        margin-top: 10px;
        background: #e8e2df;
        color: #2f2927;
      }

      .camera-wrap {
        margin: 14px 0;
        overflow: hidden;
        border-radius: 16px;
        background: #111;
      }

      video,
      .photo-preview {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        transform: scaleX(-1);
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }

      .hidden {
        display: none !important;
      }

      .gps-info {
        margin: 12px 0;
        font-size: 14px;
        line-height: 1.6;
      }

      .hint {
        margin-top: 10px;
        color: #6f6662;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <img id="profileImage" class="profile-image" alt="LINE profile" />
        <h1 class="title">MissVill OS</h1>
        <div id="status" class="status">กำลังเชื่อมต่อกับ LINE...</div>
      </section>
    </main>

    <script>
      const LIFF_ID = "2010777781-rUPome8y";
      const ATTENDANCE_API_URL =
        "https://script.google.com/macros/s/AKfycbyY1OP8umg--3Fio6SBH_76Oyqxeva78wWC-XE0TLlnPGilsSTEWDwre3w_FFn-3gOZCw/exec";

      const statusElement = document.getElementById("status");
      const profileImageElement = document.getElementById("profileImage");

      let currentProfile = null;
      let currentAction = "home";
      let currentLocation = null;
      let cameraStream = null;
      let capturedPhoto = null;

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      function showError(message) {
        stopCamera();
        statusElement.className = "status error";
        statusElement.innerHTML =
          "<strong>เกิดข้อผิดพลาด</strong><br><br>" +
          escapeHtml(message).replace(/\n/g, "<br>");
      }

      function readAction() {
        const params = new URLSearchParams(window.location.search);
        let action = params.get("action");

        if (!action) {
          const liffState = params.get("liff.state");

          if (liffState) {
            const decodedState = decodeURIComponent(liffState);
            const stateQuery = decodedState.includes("?")
              ? decodedState.split("?")[1]
              : decodedState;

            action = new URLSearchParams(stateQuery).get("action");
          }
        }

        return action || "home";
      }

      async function startApp() {
        try {
          if (typeof liff === "undefined") {
            throw new Error("ไม่พบ LINE LIFF SDK");
          }

          statusElement.textContent = "กำลังเชื่อมต่อกับ LINE...";

          await liff.init({
            liffId: LIFF_ID,
            withLoginOnExternalBrowser: true,
          });

          if (!liff.isLoggedIn()) {
            liff.login({
              redirectUri: window.location.href,
            });
            return;
          }

          currentAction = readAction();
          currentProfile = await liff.getProfile();

          if (currentProfile.pictureUrl) {
            profileImageElement.src = currentProfile.pictureUrl;
            profileImageElement.style.display = "inline-block";
          }

          if (currentAction === "clockin" || currentAction === "clockout") {
            showAttendanceStartPage();
            return;
          }

          if (currentAction === "history") {
            showComingSoon("ประวัติการเข้างาน");
            return;
          }

          if (currentAction === "leave") {
            showComingSoon("คำขอลา");
            return;
          }

          statusElement.className = "status";
          statusElement.innerHTML = `
            <strong>เชื่อมต่อ LINE สำเร็จ</strong><br><br>
            ชื่อ: ${escapeHtml(currentProfile.displayName)}
          `;
        } catch (error) {
          console.error("LIFF ERROR:", error);

          const code = error && error.code ? error.code : "NO_CODE";
          const message =
            error && error.message
              ? error.message
              : "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";

          showError(`Code: ${code}\nMessage: ${message}`);
        }
      }

      function showAttendanceStartPage() {
        const label = currentAction === "clockin" ? "Clock In" : "Clock Out";
        const buttonLabel =
          currentAction === "clockin"
            ? "เริ่มเช็กอินเข้างาน"
            : "เริ่มเช็กเอาต์ออกงาน";

        statusElement.className = "status";
        statusElement.innerHTML = `
          <strong>${label}</strong><br><br>
          สวัสดี ${escapeHtml(currentProfile.displayName)}<br><br>
          <button class="action-button" onclick="requestLocationAndCamera()">
            ${buttonLabel}
          </button>
          <p class="hint">ระบบจะขอ GPS และเปิดกล้องหน้าเพื่อถ่ายรูปสด</p>
        `;
      }

      function requestLocationAndCamera() {
        if (!navigator.geolocation) {
          showError("โทรศัพท์เครื่องนี้ไม่รองรับ GPS");
          return;
        }

        statusElement.className = "status";
        statusElement.textContent = "กำลังอ่านตำแหน่ง GPS...";

        navigator.geolocation.getCurrentPosition(
          async function (position) {
            currentLocation = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: Math.round(position.coords.accuracy),
            };

            try {
              await showLiveCamera();
            } catch (error) {
              showError(
                "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องใน LINE แล้วลองใหม่: " +
                  (error.message || error)
              );
            }
          },
          function (error) {
            showError("ไม่สามารถอ่าน GPS ได้: " + error.message);
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
          }
        );
      }

      async function showLiveCamera() {
        capturedPhoto = null;
        stopCamera();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("อุปกรณ์นี้ไม่รองรับการเปิดกล้องสด");
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 720 },
            height: { ideal: 960 },
          },
        });

        statusElement.className = "status";
        statusElement.innerHTML = `
          <strong>ถ่ายรูปยืนยันตัวตน</strong>

          <div class="gps-info">
            GPS พร้อม · ความแม่นยำ ${currentLocation.accuracy} เมตร
          </div>

          <div class="camera-wrap">
            <video id="cameraVideo" autoplay muted playsinline></video>
            <canvas id="photoCanvas" class="hidden"></canvas>
            <img
              id="photoPreview"
              class="photo-preview hidden"
              alt="ภาพยืนยันตัวตน"
            />
          </div>

          <button
            id="captureButton"
            class="action-button"
            onclick="capturePhoto()"
          >
            ถ่ายรูป
          </button>

          <button
            id="retakeButton"
            class="secondary-button hidden"
            onclick="retakePhoto()"
          >
            ถ่ายใหม่
          </button>

          <button
            id="confirmButton"
            class="action-button hidden"
            style="margin-top: 10px"
            onclick="confirmAttendance()"
          >
            ยืนยัน ${currentAction === "clockin" ? "Clock In" : "Clock Out"}
          </button>

          <p class="hint">
            ใช้กล้องสดเท่านั้น ไม่มีปุ่มเลือกรูปจากอัลบั้ม
          </p>
        `;

        const video = document.getElementById("cameraVideo");
        video.srcObject = cameraStream;
        await video.play();
      }

      function capturePhoto() {
        const video = document.getElementById("cameraVideo");
        const canvas = document.getElementById("photoCanvas");
        const preview = document.getElementById("photoPreview");

        if (!video || video.readyState < 2) {
          showError("กล้องยังไม่พร้อม กรุณารอสักครู่แล้วลองใหม่");
          return;
        }

        const targetWidth = 600;
        const targetHeight = Math.round(
          targetWidth * (video.videoHeight / video.videoWidth)
        );

        canvas.width = targetWidth;
        canvas.height = targetHeight;

        const context = canvas.getContext("2d");
        context.save();
        context.translate(targetWidth, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0, targetWidth, targetHeight);
        context.restore();

        capturedPhoto = canvas.toDataURL("image/jpeg", 0.78);
        preview.src = capturedPhoto;

        video.classList.add("hidden");
        preview.classList.remove("hidden");

        document.getElementById("captureButton").classList.add("hidden");
        document.getElementById("retakeButton").classList.remove("hidden");
        document.getElementById("confirmButton").classList.remove("hidden");

        stopCamera();
      }

      async function retakePhoto() {
        await showLiveCamera();
      }

      function confirmAttendance() {
        if (!capturedPhoto || !currentLocation || !currentProfile) {
          showError("ข้อมูลยังไม่ครบ กรุณาถ่ายรูปและเปิด GPS ใหม่อีกครั้ง");
          return;
        }

        const label = currentAction === "clockin" ? "Clock In" : "Clock Out";

        statusElement.className = "status";
        statusElement.innerHTML = `
          <strong>กำลังบันทึก ${label}...</strong><br><br>
          กรุณาอย่าปิดหน้านี้
        `;

        const payload = {
          action: currentAction,
          lineUserId: currentProfile.userId,
          lineDisplayName: currentProfile.displayName,
          latitude: currentLocation.latitude,
          longitude: currentLocation.longitude,
          accuracy: currentLocation.accuracy,
          photoDataUrl: capturedPhoto,
          userAgent: navigator.userAgent,
        };

        submitAttendance(payload);
      }

      function submitAttendance(payload) {
        const frameName = "attendanceSubmitFrame";
        let frame = document.getElementById(frameName);

        if (!frame) {
          frame = document.createElement("iframe");
          frame.id = frameName;
          frame.name = frameName;
          frame.className = "hidden";
          document.body.appendChild(frame);
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = ATTENDANCE_API_URL;
        form.target = frameName;
        form.className = "hidden";

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "payload";
        input.value = JSON.stringify(payload);

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
        form.remove();
      }

function handleAttendanceResponse(event) {
  const data = event.data;

  if (
    !data ||
    typeof data !== "object" ||
    typeof data.ok !== "boolean"
  ) {
    return;
  }

  if (!data.ok) {
    showError(data.message || "บันทึกไม่สำเร็จ");
    return;
  }

  statusElement.className = "status success";
  statusElement.innerHTML = `
    <strong>${escapeHtml(data.message)}</strong><br><br>
    ชื่อ: ${escapeHtml(
      data.employeeName || currentProfile.displayName
    )}<br>
    เวลา: ${escapeHtml(data.serverTime)}<br>
    GPS Accuracy: ${currentLocation.accuracy} เมตร
  `;
}
      function stopCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
        }
      }

      function showComingSoon(title) {
        statusElement.className = "status";
        statusElement.innerHTML = `
          <strong>${escapeHtml(title)}</strong><br><br>
          กำลังพัฒนาหน้านี้
        `;
      }

      window.addEventListener("message", handleAttendanceResponse);
      window.addEventListener("pagehide", stopCamera);
      window.addEventListener("beforeunload", stopCamera);
      window.addEventListener("load", startApp);
    </script>
  </body>
</html>
